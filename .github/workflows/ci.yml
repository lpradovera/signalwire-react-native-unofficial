name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check package and example
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle the example through Metro
        run: npm run bundle-check

      # Catches broken exports maps and type-resolution regressions, which
      # only surface in a consumer's project otherwise.
      - name: Package lint
        run: npm run verify:package

      # Runs the real Expo mod pipeline. The plugin unit tests mock
      # withInfoPlist, so this is what proves the plugin actually applies.
      - name: Verify the Expo config plugin
        run: npm run verify:prebuild
