name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Node 24: Node 20 reached end of life on 2026-04-30 and is outside the
      # engines of @testing-library/react-native (^22.13.0 || >=24) and of
      # @napi-rs/lzma-linux-x64-gnu (^22.20 || ^24.12 || >=25), which only this
      # Linux runner installs. 24 satisfies every engines range in the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Must come first: the example typechecks against the built dist, and
      # bundle-check resolves the package through its exports map. Neither
      # exists in a fresh checkout.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type-check package, example and server
        run: npm run type-check

      - name: Unit tests
        run: npm test

      # Bundles the native example through Metro (iOS + Android) and builds
      # the web example with Vite. The web build is the only evidence that
      # @signalwire/react actually runs in a browser.
      - name: Bundle both examples
        run: npm run bundle-check

      # Catches broken exports maps and type-resolution regressions, which
      # otherwise only surface inside a consumer's project.
      - name: Package lint
        run: npm run verify:package

      # Runs the real Expo mod pipeline. The plugin unit tests mock
      # withInfoPlist, so this is what proves the plugin actually applies.
      - name: Verify the Expo config plugin
        run: npm run verify:prebuild
