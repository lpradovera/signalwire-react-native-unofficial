// The package's Android side: the incoming-call notification a self-managed
// ConnectionService must show itself (see IncomingCallNotificationModule), the
// reader of a call's Telecom audio state (CallAudioStateModule), and the
// microphone foreground service for calls outside Telecom (CallForegroundService).
// Autolinked by React Native / Expo like any native library.
apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'com.signalwire.reactnative'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'androidx.core:core:1.13.1'
}
